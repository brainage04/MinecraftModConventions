name: reusable multi-loader release

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      java_version:
        description: JDK version used by release builds
        required: false
        default: '25'
        type: string
      additional_artifact_pattern:
        description: Optional glob for the NeoForge release JAR under build/libs; omit for Fabric-only projects
        required: false
        default: ''
        type: string
      release_name:
        description: GitHub release title
        required: false
        default: ''
        type: string
      publish_modrinth:
        description: Publish Fabric and NeoForge artifacts to Modrinth
        required: false
        default: true
        type: boolean
      publish_curseforge:
        description: Publish Fabric and NeoForge artifacts to CurseForge
        required: false
        default: true
        type: boolean
      modrinth_project_id:
        description: Existing Modrinth project id; synchronization resolves it when omitted
        required: false
        default: ''
        type: string
      curseforge_project_id:
        description: CurseForge numeric project id
        required: false
        default: ''
        type: string
      curseforge_project_slug:
        description: CurseForge project slug
        required: false
        default: ''
        type: string
      fabric_modrinth_task:
        description: Fabric Modrinth publication task
        required: false
        default: :fabric:publishModrinth
        type: string
      fabric_modrinth_sync_task:
        description: Fabric Modrinth project synchronization task
        required: false
        default: :fabric:syncModrinthIcon
        type: string
      fabric_modrinth_state_file:
        description: Fabric Modrinth synchronization state file
        required: false
        default: fabric/build/mod-publishing/modrinth-project-state.json
        type: string
      neoforge_modrinth_task:
        description: NeoForge Modrinth publication task
        required: false
        default: :neoforge:publishModrinth
        type: string
      fabric_curseforge_task:
        description: Fabric CurseForge publication task
        required: false
        default: :fabric:publishCurseforge
        type: string
      neoforge_curseforge_task:
        description: NeoForge CurseForge publication task
        required: false
        default: :neoforge:publishCurseforge
        type: string
      prepare_baritone:
        description: Build the required local Baritone fork before each Gradle build
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before each Gradle build
        required: false
        default: ''
        type: string
      git_ssh_repositories:
        description: Space-separated brainage04 repositories whose HTTPS clone URL, https://github.com/brainage04/<name>.git, is cloned over SSH with the git_ssh_key secret during each Gradle build; required with git_ssh_key
        required: false
        default: ''
        type: string
    secrets:
      release_token:
        description: GitHub token with contents write permission
        required: true
      modrinth_token:
        description: Modrinth personal access token
        required: false
      curseforge_token:
        description: CurseForge API token
        required: false
      git_ssh_key:
        description: Optional read-only SSH deploy key for private repositories the build clones, such as gitMod repositories
        required: false
    outputs:
      artifact_file:
        description: Exact Fabric release JAR file name
        value: ${{ jobs.prepare.outputs.artifact_file }}
      additional_artifact_file:
        description: Exact NeoForge release JAR file name
        value: ${{ jobs.prepare.outputs.additional_artifact_file }}
      release_body:
        description: Release notes shared across destinations
        value: ${{ jobs.prepare.outputs.release_body }}

permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: write
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-release-prepare.yml@v2.4.27
    with:
      runner: ${{ inputs.runner }}
      prepare_baritone: ${{ inputs.prepare_baritone }}
      java_version: ${{ inputs.java_version }}
      prepare_siblings: ${{ inputs.prepare_siblings }}
      git_ssh_repositories: ${{ inputs.git_ssh_repositories }}
      additional_artifact_pattern: ${{ inputs.additional_artifact_pattern }}
      resolve_release_notes_with_gradle: false
    secrets:
      release_token: ${{ secrets.release_token }}
      git_ssh_key: ${{ secrets.git_ssh_key }}

  github:
    needs: prepare
    permissions:
      contents: write
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-publish-github.yml@v2.4.27
    with:
      runner: ${{ inputs.runner }}
      prepare_baritone: ${{ inputs.prepare_baritone }}
      artifact_file: ${{ needs.prepare.outputs.artifact_file }}
      additional_artifact_file: ${{ needs.prepare.outputs.additional_artifact_file }}
      release_body: ${{ needs.prepare.outputs.release_body }}
      java_version: ${{ inputs.java_version }}
      publish_with_gradle: false
      release_name: ${{ inputs.release_name }}
    secrets:
      release_token: ${{ secrets.release_token }}

  modrinth-fabric:
    needs: prepare
    if: inputs.publish_modrinth
    permissions:
      contents: read
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-publish-modrinth.yml@v2.4.27
    with:
      runner: ${{ inputs.runner }}
      prepare_baritone: ${{ inputs.prepare_baritone }}
      artifact_file: ${{ needs.prepare.outputs.artifact_file }}
      release_body: ${{ needs.prepare.outputs.release_body }}
      java_version: ${{ inputs.java_version }}
      prepare_siblings: ${{ inputs.prepare_siblings }}
      git_ssh_repositories: ${{ inputs.git_ssh_repositories }}
      project_id: ${{ inputs.modrinth_project_id }}
      gradle_task: ${{ inputs.fabric_modrinth_task }}
      sync_gradle_task: ${{ inputs.fabric_modrinth_sync_task }}
      sync_state_file: ${{ inputs.fabric_modrinth_state_file }}
    secrets:
      modrinth_token: ${{ secrets.modrinth_token }}
      git_ssh_key: ${{ secrets.git_ssh_key }}

  modrinth-neoforge:
    needs:
      - prepare
      - modrinth-fabric
    if: inputs.publish_modrinth && inputs.additional_artifact_pattern != ''
    permissions:
      contents: read
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-publish-modrinth.yml@v2.4.27
    with:
      runner: ${{ inputs.runner }}
      prepare_baritone: ${{ inputs.prepare_baritone }}
      artifact_file: ${{ needs.prepare.outputs.additional_artifact_file }}
      release_body: ${{ needs.prepare.outputs.release_body }}
      java_version: ${{ inputs.java_version }}
      prepare_siblings: ${{ inputs.prepare_siblings }}
      git_ssh_repositories: ${{ inputs.git_ssh_repositories }}
      project_id: ${{ needs.modrinth-fabric.outputs.project_id }}
      gradle_task: ${{ inputs.neoforge_modrinth_task }}
      sync_project: false
    secrets:
      modrinth_token: ${{ secrets.modrinth_token }}
      git_ssh_key: ${{ secrets.git_ssh_key }}

  curseforge-fabric:
    needs: prepare
    if: inputs.publish_curseforge
    permissions:
      contents: read
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-publish-curseforge.yml@v2.4.27
    with:
      runner: ${{ inputs.runner }}
      prepare_baritone: ${{ inputs.prepare_baritone }}
      artifact_file: ${{ needs.prepare.outputs.artifact_file }}
      release_body: ${{ needs.prepare.outputs.release_body }}
      java_version: ${{ inputs.java_version }}
      prepare_siblings: ${{ inputs.prepare_siblings }}
      git_ssh_repositories: ${{ inputs.git_ssh_repositories }}
      project_id: ${{ inputs.curseforge_project_id }}
      project_slug: ${{ inputs.curseforge_project_slug }}
      gradle_task: ${{ inputs.fabric_curseforge_task }}
    secrets:
      curseforge_token: ${{ secrets.curseforge_token }}
      git_ssh_key: ${{ secrets.git_ssh_key }}

  curseforge-neoforge:
    needs:
      - prepare
      - curseforge-fabric
    if: inputs.publish_curseforge && inputs.additional_artifact_pattern != ''
    permissions:
      contents: read
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-publish-curseforge.yml@v2.4.27
    with:
      runner: ${{ inputs.runner }}
      prepare_baritone: ${{ inputs.prepare_baritone }}
      artifact_file: ${{ needs.prepare.outputs.additional_artifact_file }}
      release_body: ${{ needs.prepare.outputs.release_body }}
      java_version: ${{ inputs.java_version }}
      prepare_siblings: ${{ inputs.prepare_siblings }}
      git_ssh_repositories: ${{ inputs.git_ssh_repositories }}
      project_id: ${{ inputs.curseforge_project_id }}
      project_slug: ${{ inputs.curseforge_project_slug }}
      gradle_task: ${{ inputs.neoforge_curseforge_task }}
    secrets:
      curseforge_token: ${{ secrets.curseforge_token }}
      git_ssh_key: ${{ secrets.git_ssh_key }}
