name: reusable release preparation

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      java_version:
        description: JDK version used by the Fabric build
        required: false
        default: '25'
        type: string
      resolve_release_notes_with_gradle:
        description: Resolve release notes through the mod-publishing Gradle task
        required: false
        default: true
        type: boolean
      additional_artifact_pattern:
        description: Optional glob for one additional release JAR under build/libs
        required: false
        default: ''
        type: string
      prepare_baritone:
        description: Build the required local Baritone fork before the build
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before the consumer
        required: false
        default: ''
        type: string
      git_ssh_repositories:
        description: Space-separated brainage04 repositories whose HTTPS clone URL, https://github.com/brainage04/<name>.git, is cloned over SSH with the git_ssh_key secret during this job; required with git_ssh_key
        required: false
        default: ''
        type: string
    secrets:
      release_token:
        description: GitHub token used only when generated release notes are required
        required: true
      git_ssh_key:
        description: Optional read-only SSH deploy key for private repositories the build clones, such as gitMod repositories
        required: false
    outputs:
      artifact_file:
        description: Exact release JAR file name
        value: ${{ jobs.prepare.outputs.artifact_file }}
      additional_artifact_file:
        description: Exact additional release JAR file name, or empty when not configured
        value: ${{ jobs.prepare.outputs.additional_artifact_file }}
      release_body:
        description: Annotated-tag or GitHub-generated release notes
        value: ${{ jobs.prepare.outputs.release_body }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: write
    outputs:
      artifact_file: ${{ steps.artifact.outputs.file }}
      additional_artifact_file: ${{ steps.artifact.outputs.additional_file }}
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: remove stale sibling checkouts
        shell: bash
        run: |
          # Self-hosted runners keep their work tree between jobs; a leftover sibling such as
          # ../MinecraftModConventions would be picked up by settings.gradle's includeBuild.
          checkout="$(basename "${GITHUB_WORKSPACE}")"
          find "${GITHUB_WORKSPACE}/.." -mindepth 1 -maxdepth 1 ! -name "${checkout}" -exec rm -rf -- {} +

      - name: configure git SSH access
        shell: bash
        env:
          GIT_SSH_KEY: ${{ secrets.git_ssh_key }}
          GIT_SSH_REPOSITORIES: ${{ inputs.git_ssh_repositories }}
        run: |
          # Self-hosted runners keep their home directory between jobs, so the key lives in the job's temp
          # directory and git is configured only through environment variables exported to the later steps
          # (Gradle's gitMod clones from inside Gradle); nothing goes into global git config or ~/.ssh.
          if [ -z "${GIT_SSH_KEY}" ]; then
            exit 0
          fi
          if [ -z "${GIT_SSH_REPOSITORIES}" ]; then
            echo "git_ssh_key needs git_ssh_repositories"
            exit 1
          fi
          for name in ${GIT_SSH_REPOSITORIES}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid git SSH repository name: ${name}"
              exit 1
            fi
          done
          dir="${RUNNER_TEMP}/git-ssh"
          rm -rf "${dir}"
          (umask 077 && mkdir -p "${dir}" && printf '%s\n' "${GIT_SSH_KEY%$'\n'}" > "${dir}/id")
          chmod 600 "${dir}/id"
          count=0
          {
            echo "GIT_SSH_COMMAND=ssh -i \"${dir}/id\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=\"${dir}/known_hosts\""
            for name in ${GIT_SSH_REPOSITORIES}; do
              echo "GIT_CONFIG_KEY_${count}=url.git@github.com:brainage04/${name}.git.insteadOf"
              echo "GIT_CONFIG_VALUE_${count}=https://github.com/brainage04/${name}.git"
              count=$((count + 1))
            done
            echo "GIT_CONFIG_COUNT=${count}"
          } >> "${GITHUB_ENV}"

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: prepare required local Baritone fork
        if: inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: prepare sibling libraries
        if: inputs.prepare_siblings != ''
        env:
          PREPARE_SIBLINGS: ${{ inputs.prepare_siblings }}
        run: |
          for name in ${PREPARE_SIBLINGS}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid sibling repository name: ${name}"
              exit 1
            fi
            rm -rf "../${name}"
            git clone --depth 1 "https://github.com/brainage04/${name}.git" "../${name}"
            chmod +x "../${name}/gradlew"
            "../${name}/gradlew" -p "../${name}" --no-daemon publishAllPublicationsToLocalRepository
          done

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: verify tag matches mod version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "Expected tag v${VERSION}, got ${TAG_NAME}"
            exit 1
          fi

      - name: build
        run: ./gradlew clean build

      - name: collect exact release artifacts
        id: artifact
        env:
          ADDITIONAL_ARTIFACT_PATTERN: ${{ inputs.additional_artifact_pattern }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          ARCHIVES_NAME="$(grep '^archives_base_name=' gradle.properties | cut -d= -f2)"
          ARTIFACT_FILE="${ARCHIVES_NAME}-${VERSION}.jar"
          test -f "build/libs/${ARTIFACT_FILE}"
          mkdir -p release-artifacts
          cp "build/libs/${ARTIFACT_FILE}" "release-artifacts/${ARTIFACT_FILE}"
          echo "file=${ARTIFACT_FILE}" >> "$GITHUB_OUTPUT"
          echo "additional_file=" >> "$GITHUB_OUTPUT"
          if [ -n "${ADDITIONAL_ARTIFACT_PATTERN}" ]; then
            mapfile -t ADDITIONAL_FILES < <(compgen -G "build/libs/${ADDITIONAL_ARTIFACT_PATTERN}" || true)
            if [ "${#ADDITIONAL_FILES[@]}" -ne 1 ]; then
              echo "Expected exactly one additional release artifact matching ${ADDITIONAL_ARTIFACT_PATTERN}; found ${#ADDITIONAL_FILES[@]}."
              exit 1
            fi
            ADDITIONAL_FILE="$(basename "${ADDITIONAL_FILES[0]}")"
            if [ "${ADDITIONAL_FILE}" = "${ARTIFACT_FILE}" ]; then
              echo "Additional release artifact must differ from the primary artifact."
              exit 1
            fi
            cp "${ADDITIONAL_FILES[0]}" "release-artifacts/${ADDITIONAL_FILE}"
            echo "additional_file=${ADDITIONAL_FILE}" >> "$GITHUB_OUTPUT"
          fi

      - name: upload exact release artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: release-artifact
          path: release-artifacts/*.jar
          if-no-files-found: error

      - name: resolve release notes
        if: inputs.resolve_release_notes_with_gradle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.release_token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew resolveModReleaseNotes


      - name: resolve bootstrap release notes
        if: ${{ !inputs.resolve_release_notes_with_gradle }}
        env:
          GH_TOKEN: ${{ secrets.release_token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          NOTES="$(git for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(contents)')"
          if [ -z "${NOTES}" ]; then
            NOTES="$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${RELEASE_TAG}" \
              -f "target_commitish=${GITHUB_SHA}" \
              --jq '.body')"
          fi
          mkdir -p build/mod-publishing
          printf '%s\n' "${NOTES}" > build/mod-publishing/release-notes.md

      - name: export release notes
        id: notes
        run: |
          DELIMITER="RELEASE_NOTES_$(date +%s%N)"
          {
            echo "body<<${DELIMITER}"
            cat build/mod-publishing/release-notes.md
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: remove git SSH key
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/git-ssh"
