name: reusable Modrinth publication

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      artifact_file:
        description: Exact release JAR file name from release preparation
        required: true
        type: string
      release_body:
        description: Release notes shared across destinations
        required: true
        type: string
      java_version:
        description: JDK version used by the Fabric build
        required: false
        default: '25'
        type: string
      project_id:
        description: Existing Modrinth project id; project synchronization resolves it when omitted
        required: false
        default: ''
        type: string
      gradle_task:
        description: Gradle task that publishes this artifact to Modrinth
        required: false
        default: publishModrinth
        type: string
      sync_gradle_task:
        description: Gradle task that synchronizes the Modrinth project and icon
        required: false
        default: syncModrinthIcon
        type: string
      sync_project:
        description: Synchronize project metadata and icon before publishing
        required: false
        default: true
        type: boolean
      sync_state_file:
        description: Project state file written by the synchronization task
        required: false
        default: build/mod-publishing/modrinth-project-state.json
        type: string
      prepare_baritone:
        description: Build the required local Baritone fork before the consumer
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before the consumer
        required: false
        default: ''
        type: string
      git_ssh_repositories:
        description: Space-separated brainage04 repositories whose HTTPS clone URL, https://github.com/brainage04/<name>.git, is cloned over SSH with the git_ssh_key secret during this job; required with git_ssh_key
        required: false
        default: ''
        type: string
    secrets:
      modrinth_token:
        description: Modrinth personal access token
        required: false
      git_ssh_key:
        description: Optional read-only SSH deploy key for private repositories the build clones, such as gitMod repositories
        required: false
    outputs:
      project_id:
        description: Synchronized or configured Modrinth project id
        value: ${{ jobs.publish.outputs.project_id }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      project_id: ${{ steps.project.outputs.id }}
    steps:
      - name: check Modrinth token
        id: config
        env:
          MODRINTH_TOKEN: ${{ secrets.modrinth_token }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Modrinth publication because its token is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: remove stale sibling checkouts
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          # Self-hosted runners keep their work tree between jobs; a leftover sibling such as
          # ../MinecraftModConventions would be picked up by settings.gradle's includeBuild.
          checkout="$(basename "${GITHUB_WORKSPACE}")"
          find "${GITHUB_WORKSPACE}/.." -mindepth 1 -maxdepth 1 ! -name "${checkout}" -exec rm -rf -- {} +

      - name: configure git SSH access
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          GIT_SSH_KEY: ${{ secrets.git_ssh_key }}
          GIT_SSH_REPOSITORIES: ${{ inputs.git_ssh_repositories }}
        run: |
          # Self-hosted runners keep their home directory between jobs, so the key lives in the job's temp
          # directory and git is configured only through environment variables exported to the later steps
          # (Gradle's gitMod clones from inside Gradle); nothing goes into global git config or ~/.ssh.
          if [ -z "${GIT_SSH_KEY}" ]; then
            exit 0
          fi
          if [ -z "${GIT_SSH_REPOSITORIES}" ]; then
            echo "git_ssh_key needs git_ssh_repositories"
            exit 1
          fi
          for name in ${GIT_SSH_REPOSITORIES}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid git SSH repository name: ${name}"
              exit 1
            fi
          done
          dir="${RUNNER_TEMP}/git-ssh"
          rm -rf "${dir}"
          (umask 077 && mkdir -p "${dir}" && printf '%s\n' "${GIT_SSH_KEY%$'\n'}" > "${dir}/id")
          chmod 600 "${dir}/id"
          count=0
          {
            echo "GIT_SSH_COMMAND=ssh -i \"${dir}/id\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=\"${dir}/known_hosts\""
            for name in ${GIT_SSH_REPOSITORIES}; do
              echo "GIT_CONFIG_KEY_${count}=url.git@github.com:brainage04/${name}.git.insteadOf"
              echo "GIT_CONFIG_VALUE_${count}=https://github.com/brainage04/${name}.git"
              count=$((count + 1))
            done
            echo "GIT_CONFIG_COUNT=${count}"
          } >> "${GITHUB_ENV}"

      - name: validate gradle wrapper
        if: steps.config.outputs.enabled == 'true'
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        if: steps.config.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: prepare required local Baritone fork
        if: steps.config.outputs.enabled == 'true' && inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: prepare sibling libraries
        if: steps.config.outputs.enabled == 'true' && inputs.prepare_siblings != ''
        env:
          PREPARE_SIBLINGS: ${{ inputs.prepare_siblings }}
        run: |
          for name in ${PREPARE_SIBLINGS}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid sibling repository name: ${name}"
              exit 1
            fi
            rm -rf "../${name}"
            git clone --depth 1 "https://github.com/brainage04/${name}.git" "../${name}"
            chmod +x "../${name}/gradlew"
            "../${name}/gradlew" -p "../${name}" --no-daemon publishAllPublicationsToLocalRepository
          done

      - name: make gradle wrapper executable
        if: steps.config.outputs.enabled == 'true'
        run: chmod +x ./gradlew

      - name: download exact release artifact
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-artifact
          path: release-artifacts

      - name: synchronize Modrinth project and icon
        id: modrinth_sync
        if: steps.config.outputs.enabled == 'true' && inputs.sync_project
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_DESCRIPTION: ${{ github.event.repository.description }}
          GRADLE_TASK: ${{ inputs.sync_gradle_task }}
          MODRINTH_PROJECT_ID: ${{ inputs.project_id }}
          MODRINTH_TOKEN: ${{ secrets.modrinth_token }}
        run: ./gradlew "${GRADLE_TASK}" -PpublishModrinth=true

      - name: export synchronized Modrinth project state
        if: steps.config.outputs.enabled == 'true' && inputs.sync_project && steps.modrinth_sync.outcome == 'success'
        run: |
          state_file='${{ inputs.sync_state_file }}'
          project_id="$(jq -er '.id | select(type == "string" and length > 0)' "$state_file")"
          project_created="$(jq -er '.created | tostring' "$state_file")"
          {
            echo "MODRINTH_PROJECT_ID=$project_id"
            echo "MODRINTH_PROJECT_CREATED=$project_created"
          } >> "$GITHUB_ENV"

      - name: export configured Modrinth project
        if: steps.config.outputs.enabled == 'true' && inputs.sync_project == false
        env:
          CONFIGURED_PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -z "${CONFIGURED_PROJECT_ID}" ]; then
            echo "Modrinth project id is required when project synchronization is disabled."
            exit 1
          fi
          echo "MODRINTH_PROJECT_ID=${CONFIGURED_PROJECT_ID}" >> "$GITHUB_ENV"

      - name: expose Modrinth project id
        id: project
        if: steps.config.outputs.enabled == 'true' && (inputs.sync_project == false || steps.modrinth_sync.outcome == 'success')
        run: |
          if [ -z "${MODRINTH_PROJECT_ID}" ]; then
            echo "Modrinth project id was not resolved."
            exit 1
          fi
          echo "id=${MODRINTH_PROJECT_ID}" >> "$GITHUB_OUTPUT"

      - name: publish Modrinth version
        if: steps.config.outputs.enabled == 'true'
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
          MOD_PUBLISHING_RELEASE_JAR: release-artifacts/${{ inputs.artifact_file }}
          MODRINTH_TOKEN: ${{ secrets.modrinth_token }}
          RELEASE_BODY: ${{ inputs.release_body }}
          RELEASE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew "${GRADLE_TASK}" -PpublishModrinth=true

      - name: fail if Modrinth synchronization failed
        if: always() && steps.config.outputs.enabled == 'true' && inputs.sync_project && steps.modrinth_sync.outcome == 'failure'
        run: |
          echo "Modrinth project or icon synchronization failed before version publication."
          exit 1

      - name: remove git SSH key
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/git-ssh"
