name: reusable production GameTests

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value, a runner label or an array of labels
        required: false
        default: '"ubuntu-24.04"'
        type: string
      java_version:
        description: JDK version used by the Fabric build
        required: false
        default: '25'
        type: string
      gradle_task:
        description: GameTest aggregate task; single-loader Fabric builds pass runAllProductionGameTests
        required: false
        default: runAllGameTests
        type: string
      test_runner:
        description: Optional repository-local Python suite runner; receives an output directory followed by Gradle arguments
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: Time limit in minutes of each step that runs Gradle
        required: false
        default: 20
        type: number
      client_gametest_profile:
        description: Optional client GameTest profile exposed to production runs
        required: false
        default: ''
        type: string
      prepare_baritone:
        description: Build the required local Baritone fork before the consumer
        required: false
        default: false
        type: boolean
      prepare_siblings:
        description: Space-separated brainage04 repositories to clone into ../<name> and publish to their build/local-repo before the consumer; Name for the default branch, Name@ref (branch, tag or full sha) to pin
        required: false
        default: ''
        type: string
      git_ssh_repositories:
        description: Space-separated brainage04 repositories whose HTTPS clone URL, https://github.com/brainage04/<name>.git, is cloned over SSH with the git_ssh_key secret during this job; required with git_ssh_key
        required: false
        default: ''
        type: string
    secrets:
      git_ssh_key:
        description: Optional read-only SSH deploy key for private repositories the build clones, such as gitMod repositories
        required: false

permissions:
  contents: read

jobs:
  production-gametests:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # The job's own limit also covers the time a self-hosted runner holds the job before it runs anything, for example
    # waiting for capacity in a job-started hook; the steps that run Gradle have timeout_minutes each.
    timeout-minutes: 360
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: remove stale sibling checkouts
        shell: bash
        run: |
          # Self-hosted runners keep their work tree between jobs; a leftover sibling such as
          # ../MinecraftModConventions would be picked up by settings.gradle's includeBuild.
          checkout="$(basename "${GITHUB_WORKSPACE}")"
          find "${GITHUB_WORKSPACE}/.." -mindepth 1 -maxdepth 1 ! -name "${checkout}" -exec rm -rf -- {} +

      - name: configure git SSH access
        shell: bash
        env:
          GIT_SSH_KEY: ${{ secrets.git_ssh_key }}
          GIT_SSH_REPOSITORIES: ${{ inputs.git_ssh_repositories }}
        run: |
          # Self-hosted runners keep their home directory between jobs, so the key lives in the job's temp
          # directory and git is configured only through environment variables exported to the later steps
          # (Gradle's gitMod clones from inside Gradle); nothing goes into global git config or ~/.ssh.
          if [ -z "${GIT_SSH_KEY}" ]; then
            exit 0
          fi
          if [ -z "${GIT_SSH_REPOSITORIES}" ]; then
            echo "git_ssh_key needs git_ssh_repositories"
            exit 1
          fi
          for name in ${GIT_SSH_REPOSITORIES}; do
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid git SSH repository name: ${name}"
              exit 1
            fi
          done
          dir="${RUNNER_TEMP}/git-ssh"
          rm -rf "${dir}"
          (umask 077 && mkdir -p "${dir}" && printf '%s\n' "${GIT_SSH_KEY%$'\n'}" > "${dir}/id")
          chmod 600 "${dir}/id"
          count=0
          {
            echo "GIT_SSH_COMMAND=ssh -i \"${dir}/id\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=\"${dir}/known_hosts\""
            for name in ${GIT_SSH_REPOSITORIES}; do
              echo "GIT_CONFIG_KEY_${count}=url.git@github.com:brainage04/${name}.git.insteadOf"
              echo "GIT_CONFIG_VALUE_${count}=https://github.com/brainage04/${name}.git"
              count=$((count + 1))
            done
            echo "GIT_CONFIG_COUNT=${count}"
          } >> "${GITHUB_ENV}"

      - name: install EGL for the production client
        # The run step forces SDL's EGL path (see there); GitHub's runner image has no libEGL.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: microsoft

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: prepare required local Baritone fork
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: inputs.prepare_baritone
        run: |
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          rm -rf ../baritone
          git clone --depth 1 --branch "minecraft-${MINECRAFT_VERSION}" https://github.com/brainage04/baritone.git ../baritone
          chmod +x ../baritone/gradlew
          ../baritone/gradlew -p ../baritone \
            --no-daemon \
            -Pmaven_group=io.github.brainage04 \
            publishAllPublicationsToLocalBaritoneRepository

      - name: prepare sibling libraries
        timeout-minutes: ${{ inputs.timeout_minutes }}
        if: inputs.prepare_siblings != ''
        env:
          PREPARE_SIBLINGS: ${{ inputs.prepare_siblings }}
        run: |
          # Each entry is Name (the default branch) or Name@ref, where ref is a branch, a tag or a
          # full commit sha, so a build can pin a sibling that is not released yet.
          for entry in ${PREPARE_SIBLINGS}; do
            name="${entry%%@*}"
            ref=""
            if [[ "${entry}" == *@* ]]; then
              ref="${entry#*@}"
            fi
            if [[ ! "${name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid sibling repository name: ${name}"
              exit 1
            fi
            if [[ -n "${ref}" && ! "${ref}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Invalid sibling ref: ${ref}"
              exit 1
            fi
            rm -rf "../${name}"
            if [[ -n "${ref}" ]]; then
              git init -q "../${name}"
              git -C "../${name}" remote add origin "https://github.com/brainage04/${name}.git"
              git -C "../${name}" fetch --depth 1 origin "${ref}"
              git -C "../${name}" checkout -q --detach FETCH_HEAD
            else
              git clone --depth 1 "https://github.com/brainage04/${name}.git" "../${name}"
            fi
            chmod +x "../${name}/gradlew"
            "../${name}/gradlew" -p "../${name}" --no-daemon publishAllPublicationsToLocalRepository
          done

      - name: run production GameTests
        timeout-minutes: ${{ inputs.timeout_minutes }}
        env:
          # Minecraft 26.3 asks SDL3 for an sRGB-capable OpenGL framebuffer. Ubuntu 24.04's Xvfb (21.1.12), on GitHub's
          # image and on the self-hosted runner image alike, has no sRGB-capable GLX visual (`glxinfo -v` lists sRGB=N
          # for every fbconfig), so SDL's GLX path fails with "Couldn't find matching GLX visual" and the production
          # client never starts; SDL's EGL path finds an sRGB config there.
          SDL_VIDEO_FORCE_EGL: '1'
          REQUESTED_CLIENT_GAMETEST_PROFILE: ${{ inputs.client_gametest_profile }}
          REQUESTED_TEST_RUNNER: ${{ inputs.test_runner }}
        run: |
          if [ -n "${REQUESTED_CLIENT_GAMETEST_PROFILE}" ]; then
            export CLIENT_GAMETEST_PROFILE="${REQUESTED_CLIENT_GAMETEST_PROFILE}"
          fi
          if [ -n "${REQUESTED_TEST_RUNNER}" ]; then
            python3 "${REQUESTED_TEST_RUNNER}" build/test-lanes/ci \
              --no-daemon ${{ inputs.gradle_task }}
          else
            ./gradlew --no-daemon ${{ inputs.gradle_task }}
          fi

      - name: store production GameTest reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: production-gametest-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/*/logs/
            **/run/gametest/logs/
            **/build/test-lanes/

      - name: remove git SSH key
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/git-ssh"
