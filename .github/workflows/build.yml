name: build
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  fast-quality:
    uses: ./.github/workflows/reusable-quality.yml
    with:
      conventions_ref: ${{ github.sha }}
  build:
    needs: fast-quality
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: bootstrap local quality plugin without publication
        run: ./gradlew --no-daemon :gradle-plugin:java-quality-conventions:pluginUnderTestMetadata

      - name: build with local quality policy
        run: ./gradlew --no-daemon -I quality/self-check.init.gradle build

      - name: store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: Artifacts
          path: build/libs/
